general {
    hide_cursor = true
    #ignore_empty_input = true
}

background {
    color = rgba(0, 0, 0, 1.0)
}

input-field {
    size = 250, 50
    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.2

    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgba(255, 255, 255, 1.0)

    fade_on_empty = false
    rounding = 8

    placeholder_text = Enter password...
    hide_input = false

    position = 0, 0
    halign = center
    valign = center

    fail_text = <i>$FAIL <b>($ATTEMPTS)</b><i>
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
}
