input {
    kb_layout = us,ara
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle

    sensitivity = 0 # keep neutral, avoids extra processing

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = false

        # Important for battery + usability
        disable_while_typing = true

        # Prevent unnecessary wakeups
        scroll_factor = 1.0
    }
}

misc {
    # Reduce input-related overhead
    enable_swallow = false
}
