layerrule = blur on, match:namespace ^(notifications)$
layerrule = ignore_alpha 0, match:namespace ^(notifications)$

# windowrulev2 is now deprecated; use the new unified windowrule
windowrule = float 1, match:class ^(virt-manager)$
windowrule = size 800 600, match:class ^(virt-manager)$
windowrule = center 1, match:class ^(virt-manager)$

# New 2026 Layer Rule Syntax
layerrule = blur on, match:namespace ^(rofi)$
layerrule = ignore_alpha 0.2, match:namespace ^(rofi)$

decoration {
    blur {
        enabled = true
        size = 4
        passes = 1
        new_optimizations = true
    }
}

# ~/.config/hypr/configs/rules.conf

windowrule {
    name = godot-scratchpad
    match:class = ^(godot_scratchpad)$
    float = on
    center = on
    size = 1100 700
}
