# ~/.config/hypr/configs/general.conf

env = MOZ_ENABLE_WAYLAND,1
env = GODOT_DISPLAY_DRIVER,wayland

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = rgba(ffffffaa)
    col.inactive_border = rgba(444444aa)

    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 6

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    # pseudotile was removed in 0.55
    preserve_split = true
}

misc {
    # vfr moved to debug block
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

debug {
    # New location for VFR in 0.55
    vfr = true
}
