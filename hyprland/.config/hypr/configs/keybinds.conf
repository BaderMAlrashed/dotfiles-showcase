# ===========================================================================
# VARIABLES & CORE BINDINGS
# ===========================================================================
$mainMod = SUPER
$terminal = foot
$menu = fuzzel
$browser = firefox

# Test Scratchpad Window Rule
bind = $mainMod, E, exec, foot --app-id=godot_scratchpad
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, C, exec, foot -e calcurse
bind = $mainMod ALT, L, exec, hyprlock
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exit

# Quick Capture Inbox
bind = $mainMod, L, exec, ~/.local/bin/quick-capture.sh

# ===========================================================================
# LAYOUT CONTROLS (Updated for 0.54+)
# ===========================================================================
bind = $mainMod, Space, togglefloating
bind = $mainMod, Space, centerwindow
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo

# 'togglesplit' and 'swapsplit' are now handled via layoutmsg in 0.54
bind = $mainMod, V, layoutmsg, togglesplit 

# ===========================================================================
# NAVIGATION (Vim-style)
# ===========================================================================
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# ===========================================================================
# WORKSPACES
# ===========================================================================
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5


# ── Screenshots ────────────────────────────────────────────
# Full screen → save to ~/Pictures/Screenshots/
bind = , Print, exec, grimblast --notify save screen ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Full screen → copy to clipboard
bind = CTRL, Print, exec, grimblast --notify copy screen

# Region select → save
bind = SHIFT, Print, exec, grimblast --notify save area ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Region select → copy to clipboard
bind = CTRL SHIFT, Print, exec, grimblast --notify copy area

# Active window → save
bind = ALT, Print, exec, grimblast --notify save active ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Region select → open in swappy (annotate before saving)
bind = SUPER, Print, exec, grimblast --notify save area - | swappy -f -

# ── Screen Recording ────────────────────────────────────────
bind = SUPER, R, exec, killall -s SIGINT wf-recorder && notify-send "Recording" "Stopped" -i media-record || (notify-send "Recording" "Started — Full Screen" -i media-record && wf-recorder -f ~/Videos/Recordings/$(date +%Y-%m-%d_%H-%M-%S).mp4)

bind = SUPER SHIFT, R, exec, killall -s SIGINT wf-recorder && notify-send "Recording" "Stopped" -i media-record || (notify-send "Recording" "Started — Region" -i media-record && wf-recorder -g "$(slurp)" -f ~/Videos/Recordings/$(date +%Y-%m-%d_%H-%M-%S).mp4)

bind = SUPER ALT, R, exec, killall -s SIGINT wf-recorder && notify-send "Recording" "Stopped" -i media-record || (notify-send "Recording" "Started — With Mic" -i media-record && wf-recorder --audio -f ~/Videos/Recordings/$(date +%Y-%m-%d_%H-%M-%S).mp4)

# ===========================================================================
# THINKPAD T14 HARDWARE (Battery & Volume)
# ===========================================================================
# 'e' = repeat when held, 'l' = works on lockscreen
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


# ===========================================================================
# THINKPAD HARDWARE INTEGRATION (F1 - F12)
# ===========================================================================

# F1 - F3: Volume Controls
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

# F4: Mic Mute
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# F5 - F6: Backlight Controls
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+

# F7: External Display / Projector (Commonly used for monitor mirroring)
bind = , XF86Display, exec, hyprctl dispatch layoutmsg swapwithmaster

# F8: Airplane Mode (Uses rfkill to toggle all wireless)
bind = , XF86RFKill, exec, nmcli radio all $(nmcli radio all | grep -q "enabled" && echo "off" || echo "on")

# F9: Settings / Notification Center (ThinkPad Gear Icon)
bind = , XF86NotificationCenter, exec, makoctl dismiss -a

# F10 - F11: Communication (Answer/Hangup keys)
# These are great for mapping to your browser or communication apps
bind = , XF86PickupPhone, exec, playerctl play-pause
bind = , XF86HangupPhone, exec, playerctl stop

# F12: The "Star" Key (User Defined)
# Since you are a network engineer, this is perfect for your terminal or a dashboard
bind = , XF86Favorites, exec, $terminal -e nmtui

# ===========================================================================
# KEYBOARD BACKLIGHT (ThinkPad Special)
# ===========================================================================
bind = , XF86KbdBrightnessUp, exec, brightnessctl -d *::kbd_backlight set +1
bind = , XF86KbdBrightnessDown, exec, brightnessctl -d *::kbd_backlight set 1-
